name: Gerar Short do dia
on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'
jobs:
  short:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Instalar dependências
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install piper-tts pillow numpy
          curl -L -o pt_BR-faber-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx
          curl -L -o pt_BR-faber-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json
      - name: Gerar o próximo Short da fila
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import math, os, subprocess, wave, json
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageChops

          W, H = 1080, 1920
          FONT_FILE = next(f for f in [os.environ.get("FONT_FILE", ""),
                                       "/usr/share/fonts/opentype/inter/Inter-ExtraBold.otf",
                                       "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"] if f and os.path.exists(f))
          COR = {"ouro": (255, 205, 110), "branco": (255, 255, 255), "azul": (110, 170, 255),
                 "rosa": (255, 110, 140), "suave": (190, 180, 220), "cinza": (90, 70, 110)}


          def font(s):
              return ImageFont.truetype(FONT_FILE, s)


          def bg():
              y = np.linspace(0, 1, H)[:, None]
              top = np.array([14, 12, 40]); bot = np.array([58, 22, 70])
              arr = (top + (bot - top) * y[..., None]).repeat(W, axis=1).reshape(H, W, 3)
              im = Image.fromarray(arr.astype("uint8")); d = ImageDraw.Draw(im)
              rng = np.random.default_rng(7)
              for _ in range(90):
                  x, yy = int(rng.integers(0, W)), int(rng.integers(0, H)); r = int(rng.integers(1, 4))
                  d.ellipse([x - r, yy - r, x + r, yy + r], fill=(255, 255, 255))
              return im


          def esfera(im, cx, cy, r, base, glow):
              g = Image.new("RGB", (W, H), (0, 0, 0))
              ImageDraw.Draw(g).ellipse([cx - r * 1.25, cy - r * 1.25, cx + r * 1.25, cy + r * 1.25], fill=glow)
              im.paste(ImageChops.add(im, g.filter(ImageFilter.GaussianBlur(70))))
              yy, xx = np.mgrid[0:2 * r, 0:2 * r]
              dx = (xx - r) / r; dy = (yy - r) / r; m = dx * dx + dy * dy <= 1
              z = np.sqrt(np.clip(1 - dx * dx - dy * dy, 0, 1))
              luz = np.clip(0.35 + 0.75 * (-dx * 0.5 - dy * 0.5 + z * 0.7), 0, 1.1) + 0.06 * np.sin(dy * 9 + dx * 2)
              col = np.clip(np.array(base)[None, None, :] * luz[..., None], 0, 255)
              rgba = Image.fromarray(np.dstack([col, m * 255]).astype("uint8"), "RGBA")
              im.paste(rgba, (cx - r, cy - r), rgba)


          def coracao(d, cx, cy, s, fill):
              pts = []
              for i in range(200):
                  t = i / 200 * 2 * math.pi
                  pts.append((cx + 16 * math.sin(t) ** 3 * s,
                              cy - (13 * math.cos(t) - 5 * math.cos(2 * t) - 2 * math.cos(3 * t) - math.cos(4 * t)) * s))
              d.polygon(pts, fill=fill)


          def icone(im, ic):
              d = ImageDraw.Draw(im); k = ic.get("k", "nada")
              if k == "planeta":
                  esfera(im, 540, 520, 240, (236, 176, 92), (120, 60, 20))
              elif k == "saturno":
                  d.arc([140, 400, 940, 640], 180, 360, fill=(230, 200, 150), width=16)
                  esfera(im, 540, 520, 200, (225, 190, 130), (110, 80, 30))
                  d = ImageDraw.Draw(im); d.arc([140, 400, 940, 640], 0, 180, fill=(230, 200, 150), width=16)
              elif k == "lua":
                  esfera(im, 540, 520, 240, (200, 200, 205), (60, 60, 90))
                  d = ImageDraw.Draw(im)
                  for x, y, r in [(470, 440, 40), (620, 560, 55), (520, 620, 28), (600, 430, 22)]:
                      d.ellipse([x - r, y - r, x + r, y + r], fill=(150, 150, 158))
              elif k == "sol":
                  esfera(im, 540, 520, 240, (255, 215, 120), (200, 120, 20))
              elif k == "plutao":
                  esfera(im, 540, 520, 150, (190, 160, 140), (70, 50, 40))
                  d = ImageDraw.Draw(im); d.ellipse([120, 220, 960, 820], outline=(110, 100, 160), width=5)
              elif k == "coracao":
                  coracao(d, 540, 520, 14, COR["rosa"])
              elif k == "gota":
                  d.ellipse([370, 430, 710, 770], fill=COR["azul"])
                  d.polygon([(540, 230), (385, 600), (695, 600)], fill=COR["azul"])
              elif k == "lampada":
                  esfera(im, 540, 460, 170, (255, 225, 130), (200, 150, 30))
                  d = ImageDraw.Draw(im)
                  d.rounded_rectangle([450, 640, 630, 720], 20, fill=(150, 150, 165))
                  d.rounded_rectangle([480, 720, 600, 780], 20, fill=(120, 120, 140))
              elif k == "cubos":
                  for x, y, c in [(330, 600, (150, 105, 70)), (540, 600, (170, 120, 80)), (435, 400, (160, 112, 75)), (750, 600, (140, 98, 66))]:
                      d.rounded_rectangle([x - 90, y - 90, x + 90, y + 90], 22, fill=c)
              elif k == "barras":
                  itens = ic["itens"]; mx = max(v for _, v, _ in itens)
                  y = 360
                  for rot, v, cor in itens:
                      w = max(int(800 * v / mx), 60)
                      d.rounded_rectangle([140, y, 140 + w, y + 130], 30, fill=COR[cor])
                      f = font(58); tw = d.textlength(rot, font=f)
                      if tw + 60 <= w:   # cabe dentro da barra
                          d.text((170, y + 30), rot, font=f, fill=(20, 10, 40))
                      else:              # barra curta: escreve ao lado
                          d.text((140 + w + 24, y + 30), rot, font=f, fill=COR[cor])
                      y += 230


          def texto(d, blocos, y):
              for linhas, tam, cor in blocos:
                  for l in linhas:
                      s = tam
                      while d.textlength(l, font=font(s)) > W - 100 and s > 20:
                          s -= 4
                      f = font(s)
                      d.text(((W - d.textlength(l, font=f)) / 2, y), l, font=f, fill=COR[cor])
                      y += tam + 14
                  y += 22


          def cena(c):
              im = bg(); icone(im, c.get("icone", {"k": "nada"}))
              d = ImageDraw.Draw(im); texto(d, c["texto"], c.get("y", 960))
              f = font(34); t = "curiosidades de ciência"
              d.text(((W - d.textlength(t, font=f)) / 2, 1740), t, font=f, fill=COR["suave"])
              return im


          FIM = {"fala": "Gostou? Segue o canal para mais curiosidades de ciência.",
                 "icone": {"k": "coracao"}, "y": 1000,
                 "texto": [[["Gostou?"], 130, "ouro"], [["Segue o canal", "para mais curiosidades", "de ciência"], 86, "branco"]]}

          # ---------------------------------------------------------------------------
          # FILA DE ASSUNTOS. Cada rodada pega o primeiro assunto que ainda não foi publicado.
          # ---------------------------------------------------------------------------
          def T(*b):
              return list(b)

          ASSUNTOS = [
           {"slug": "lua", "titulo": "A Lua está fugindo da Terra 🌙 #Shorts",
            "descricao": "A Lua se afasta da Terra cerca de 3,8 cm por ano, quase a velocidade com que as unhas crescem. Os cientistas medem isso com lasers apontados para espelhos que os astronautas deixaram lá.",
            "tags": ["lua", "espaço", "astronomia"],
            "cenas": [
             {"fala": "A Lua está se afastando da Terra.", "icone": {"k": "lua"}, "texto": T([["A LUA ESTÁ", "SE AFASTANDO", "DA TERRA"], 110, "branco"])},
             {"fala": "Ela se afasta cerca de três vírgula oito centímetros por ano.", "icone": {"k": "lua"}, "texto": T([["Ela se afasta cerca de"], 70, "branco"], [["3,8 cm"], 200, "ouro"], [["por ano"], 80, "branco"])},
             {"fala": "É quase a mesma velocidade com que as suas unhas crescem.", "icone": {"k": "lua"}, "texto": T([["Quase a velocidade com", "que suas unhas crescem"], 76, "branco"])},
             {"fala": "Os cientistas medem isso com lasers, apontados para espelhos que os astronautas deixaram na Lua.", "icone": {"k": "lua"}, "texto": T([["Medido com lasers e", "espelhos deixados na Lua", "pelos astronautas"], 70, "ouro"])},
             FIM]},
           {"slug": "luz-do-sol", "titulo": "Você nunca vê o Sol como ele é agora ☀️ #Shorts",
            "descricao": "A luz do Sol leva cerca de 8 minutos e 20 segundos para chegar até a Terra. Ou seja: tudo o que vemos do Sol é o passado, de 8 minutos atrás.",
            "tags": ["sol", "luz", "espaço"],
            "cenas": [
             {"fala": "Se o Sol sumisse agora, a gente só ficaria sabendo depois de oito minutos.", "icone": {"k": "sol"}, "texto": T([["SE O SOL", "SUMISSE AGORA..."], 110, "branco"])},
             {"fala": "A luz do Sol leva cerca de oito minutos e vinte segundos para chegar até a Terra.", "icone": {"k": "sol"}, "texto": T([["A luz leva"], 76, "branco"], [["8 min 20 s"], 170, "ouro"], [["para chegar aqui"], 76, "branco"])},
             {"fala": "Ou seja, o Sol que você vê no céu é como ele estava há oito minutos.", "icone": {"k": "sol"}, "texto": T([["O Sol que você vê", "é o de 8 minutos atrás"], 80, "branco"])},
             FIM]},
           {"slug": "saturno", "titulo": "Saturno boiaria na água 🪐 #Shorts",
            "descricao": "A densidade média de Saturno é cerca de 0,7 g/cm³, menor que a da água (1 g/cm³). Só que ele é feito de gás e não existe oceano grande o bastante para testar.",
            "tags": ["saturno", "planetas", "espaço"],
            "cenas": [
             {"fala": "Saturno é tão leve que boiaria na água.", "icone": {"k": "saturno"}, "texto": T([["SATURNO", "BOIARIA", "NA ÁGUA"], 120, "branco"])},
             {"fala": "A densidade média dele é menor que a da água: zero vírgula sete gramas por centímetro cúbico, contra um da água.", "icone": {"k": "saturno"}, "texto": T([["Densidade de Saturno"], 66, "branco"], [["0,7 g/cm³"], 160, "ouro"], [["Água: 1 g/cm³"], 80, "azul"])},
             {"fala": "O problema é que ele é feito de gás, e não existe um oceano grande o bastante para testar.", "icone": {"k": "saturno"}, "texto": T([["Só falta um oceano", "grande o bastante"], 84, "branco"])},
             FIM]},
           {"slug": "banana", "titulo": "A banana é uma baga, e o morango não 🍌 #Shorts",
            "descricao": "Para os botânicos, baga é uma fruta carnuda que vem de uma única flor e tem sementes dentro. A banana se encaixa. Já o morango tem as sementes por fora.",
            "tags": ["banana", "morango", "botânica"],
            "cenas": [
             {"fala": "A banana é uma fruta do tipo baga, e o morango não é.", "icone": {"k": "lampada"}, "texto": T([["A BANANA", "É UMA BAGA"], 130, "ouro"], [["O morango, não"], 90, "branco"])},
             {"fala": "Para os botânicos, baga é uma fruta carnuda que vem de uma única flor e tem sementes dentro.", "icone": {"k": "lampada"}, "texto": T([["Baga: fruta carnuda,", "de uma só flor,", "com sementes dentro"], 76, "branco"])},
             {"fala": "A banana se encaixa nisso. Já o morango tem as sementes por fora.", "icone": {"k": "lampada"}, "texto": T([["O morango tem", "as sementes por fora"], 90, "ouro"])},
             {"fala": "O que a gente chama de fruta nem sempre é o que a ciência chama.", "icone": {"k": "lampada"}, "texto": T([["Nome comum e nome", "científico nem sempre", "combinam"], 76, "branco"])},
             FIM]},
           {"slug": "tubarao", "titulo": "Tubarões são mais antigos que as árvores 🦈 #Shorts",
            "descricao": "Os primeiros tubarões surgiram há cerca de 450 milhões de anos. As primeiras árvores, há uns 385 milhões. Ou seja, já tinha tubarão nadando antes de existir floresta.",
            "tags": ["tubarão", "pré-história", "animais"],
            "cenas": [
             {"fala": "Tubarões são mais antigos que as árvores.", "icone": {"k": "barras", "itens": [["Tubarões 450", 450, "azul"], ["Árvores 385", 385, "ouro"]]}, "y": 900, "texto": T([["TUBARÕES SÃO", "MAIS ANTIGOS", "QUE AS ÁRVORES"], 100, "branco"])},
             {"fala": "Os primeiros tubarões apareceram há cerca de quatrocentos e cinquenta milhões de anos.", "icone": {"k": "barras", "itens": [["Tubarões 450", 450, "azul"], ["Árvores 385", 385, "ouro"]]}, "y": 900, "texto": T([["Tubarões:"], 76, "branco"], [["450 milhões"], 130, "azul"], [["de anos"], 70, "branco"])},
             {"fala": "As primeiras árvores só surgiram há uns trezentos e oitenta e cinco milhões de anos.", "icone": {"k": "barras", "itens": [["Tubarões 450", 450, "azul"], ["Árvores 385", 385, "ouro"]]}, "y": 900, "texto": T([["Árvores:"], 76, "branco"], [["385 milhões"], 130, "ouro"], [["de anos"], 70, "branco"])},
             {"fala": "Ou seja, já tinha tubarão nadando antes de existir floresta.", "icone": {"k": "barras", "itens": [["Tubarões 450", 450, "azul"], ["Árvores 385", 385, "ouro"]]}, "y": 900, "texto": T([["Tubarão nadava", "antes de existir", "floresta"], 90, "branco"])},
             FIM]},
           {"slug": "vombate", "titulo": "Esse animal faz cocô em formato de cubo 🟫 #Shorts",
            "descricao": "O vombate é o único animal conhecido que faz cocô em cubos. Os cubos não rolam, então ele os empilha em pedras e troncos para marcar território.",
            "tags": ["vombate", "animais", "curiosidades"],
            "cenas": [
             {"fala": "O vombate faz cocô em formato de cubo.", "icone": {"k": "cubos"}, "texto": T([["O VOMBATE", "FAZ COCÔ", "EM CUBOS"], 120, "ouro"])},
             {"fala": "Ele é o único animal conhecido que faz isso.", "icone": {"k": "cubos"}, "texto": T([["O único animal", "conhecido que faz isso"], 90, "branco"])},
             {"fala": "Como os cubos não rolam, ele os empilha em pedras e troncos para marcar território.", "icone": {"k": "cubos"}, "texto": T([["Cubos não rolam:", "ele empilha para", "marcar território"], 84, "branco"])},
             {"fala": "Cientistas descobriram que o segredo está no intestino, que estica de formas diferentes em cada parte.", "icone": {"k": "cubos"}, "texto": T([["O segredo está no", "intestino, que estica", "de jeitos diferentes"], 76, "branco"])},
             FIM]},
           {"slug": "raio", "titulo": "O raio é 5 vezes mais quente que o Sol ⚡ #Shorts",
            "descricao": "Um raio pode aquecer o ar ao redor a cerca de 30 mil graus. A superfície do Sol tem cerca de 5.500 graus. Ou seja, o raio chega a ser umas 5 vezes mais quente.",
            "tags": ["raio", "sol", "clima"],
            "cenas": [
             {"fala": "Um raio é muito mais quente que a superfície do Sol.", "icone": {"k": "barras", "itens": [["Raio 30.000", 30000, "ouro"], ["Sol 5.500", 5500, "rosa"]]}, "y": 900, "texto": T([["O RAIO É MAIS", "QUENTE QUE", "O SOL"], 110, "branco"])},
             {"fala": "Ele pode aquecer o ar ao redor a cerca de trinta mil graus.", "icone": {"k": "barras", "itens": [["Raio 30.000", 30000, "ouro"], ["Sol 5.500", 5500, "rosa"]]}, "y": 900, "texto": T([["Raio:"], 76, "branco"], [["30.000 °C"], 150, "ouro"])},
             {"fala": "A superfície do Sol tem cerca de cinco mil e quinhentos graus.", "icone": {"k": "barras", "itens": [["Raio 30.000", 30000, "ouro"], ["Sol 5.500", 5500, "rosa"]]}, "y": 900, "texto": T([["Superfície do Sol:"], 76, "branco"], [["5.500 °C"], 150, "rosa"])},
             {"fala": "Ou seja, o raio chega a ser umas cinco vezes mais quente.", "icone": {"k": "barras", "itens": [["Raio 30.000", 30000, "ouro"], ["Sol 5.500", 5500, "rosa"]]}, "y": 900, "texto": T([["Umas"], 76, "branco"], [["5x"], 230, "ouro"], [["mais quente"], 76, "branco"])},
             FIM]},
           {"slug": "cerebro", "titulo": "Seu cérebro gasta 20% da sua energia 🧠 #Shorts",
            "descricao": "O cérebro pesa só cerca de 2% do corpo, mas gasta cerca de 20% de toda a energia. E continua gastando muita energia mesmo quando você está dormindo.",
            "tags": ["cérebro", "corpo humano", "ciência"],
            "cenas": [
             {"fala": "O seu cérebro gasta cerca de vinte por cento de toda a energia do corpo.", "icone": {"k": "barras", "itens": [["Energia 20%", 20, "ouro"], ["Peso 2%", 2, "azul"]]}, "y": 900, "texto": T([["SEU CÉREBRO USA"], 80, "branco"], [["20%"], 230, "ouro"], [["DA ENERGIA"], 80, "branco"])},
             {"fala": "E ele pesa só uns dois por cento do seu corpo.", "icone": {"k": "barras", "itens": [["Energia 20%", 20, "ouro"], ["Peso 2%", 2, "azul"]]}, "y": 900, "texto": T([["Mas pesa só"], 76, "branco"], [["2%"], 230, "azul"], [["do corpo"], 80, "branco"])},
             {"fala": "Mesmo quando você está dormindo, ele continua gastando muita energia.", "icone": {"k": "barras", "itens": [["Energia 20%", 20, "ouro"], ["Peso 2%", 2, "azul"]]}, "y": 900, "texto": T([["Até dormindo, ele", "continua gastando", "muita energia"], 84, "branco"])},
             FIM]},
           {"slug": "plutao", "titulo": "Plutão ainda não deu uma volta no Sol 🪐 #Shorts",
            "descricao": "Plutão foi descoberto em 1930 e leva cerca de 248 anos para dar uma volta ao redor do Sol. A primeira volta completa desde a descoberta só termina em 2178.",
            "tags": ["plutão", "planeta anão", "espaço"],
            "cenas": [
             {"fala": "Plutão ainda não completou uma volta ao redor do Sol desde que foi descoberto.", "icone": {"k": "plutao"}, "y": 900, "texto": T([["PLUTÃO AINDA", "NÃO DEU UMA", "VOLTA NO SOL"], 110, "branco"])},
             {"fala": "Ele foi descoberto em mil novecentos e trinta.", "icone": {"k": "plutao"}, "y": 900, "texto": T([["Descoberto em"], 76, "branco"], [["1930"], 220, "ouro"])},
             {"fala": "Uma volta completa leva cerca de duzentos e quarenta e oito anos.", "icone": {"k": "plutao"}, "y": 900, "texto": T([["Uma volta leva"], 76, "branco"], [["248 anos"], 170, "ouro"])},
             {"fala": "Então ele só termina essa primeira volta no ano dois mil cento e setenta e oito.", "icone": {"k": "plutao"}, "y": 900, "texto": T([["Primeira volta"], 76, "branco"], [["completa em"], 76, "branco"], [["2178"], 220, "ouro"])},
             FIM]},
           {"slug": "ossos", "titulo": "Bebês têm mais ossos que adultos 👶 #Shorts",
            "descricao": "Bebês nascem com cerca de 300 ossos, e adultos têm 206. Isso acontece porque vários ossos, principalmente os do crânio e da coluna, vão se juntando com o crescimento.",
            "tags": ["ossos", "corpo humano", "bebês"],
            "cenas": [
             {"fala": "Bebês nascem com cerca de trezentos ossos, mas adultos têm duzentos e seis.", "icone": {"k": "barras", "itens": [["Bebê 300", 300, "ouro"], ["Adulto 206", 206, "azul"]]}, "y": 900, "texto": T([["BEBÊS TÊM MAIS", "OSSOS QUE", "ADULTOS"], 110, "branco"])},
             {"fala": "Isso acontece porque vários ossos, principalmente os do crânio e da coluna, vão se juntando com o crescimento.", "icone": {"k": "barras", "itens": [["Bebê 300", 300, "ouro"], ["Adulto 206", 206, "azul"]]}, "y": 900, "texto": T([["Vários ossos vão", "se juntando enquanto", "a gente cresce"], 84, "branco"])},
             {"fala": "Parte deles ainda é cartilagem, que vira osso com o tempo.", "icone": {"k": "barras", "itens": [["Bebê 300", 300, "ouro"], ["Adulto 206", 206, "azul"]]}, "y": 900, "texto": T([["Parte é cartilagem,", "que vira osso", "com o tempo"], 84, "ouro"])},
             FIM]},
          ]


          def run(cmd, **kw):
              subprocess.run(cmd, check=True, **kw)


          def duracao(p):
              return float(subprocess.check_output(["ffprobe", "-v", "error", "-show_entries", "format=duration",
                                                    "-of", "csv=p=0", p]).decode().strip())


          def narrar(texto, saida):
              if os.environ.get("STUB_TTS"):
                  n = len(texto.split()); sr = 22050
                  with wave.open(saida, "w") as w:
                      w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
                      w.writeframes(np.zeros(int(sr * 0.4 * n), dtype="int16").tobytes())
                  return
              run(["python3", "-m", "piper", "--model", "pt_BR-faber-medium.onnx", "--output_file", saida],
                  input=texto.encode())


          def musica(total, saida):
              sr = 44100; t = np.arange(int(sr * total)) / sr
              acordes = [(110, 164.8, 220), (98, 146.8, 196), (87.3, 130.8, 174.6), (98, 146.8, 196)]
              sig = np.zeros_like(t)
              for i, ch in enumerate(acordes):
                  a, b = i * total / 4, (i + 1) * total / 4
                  seg = (t >= a) & (t < b); env = np.clip(np.minimum((t - a) / 1.5, (b - t) / 1.5), 0, 1)
                  for f in ch:
                      sig += seg * env * np.sin(2 * np.pi * f * t + 0.3 * np.sin(2 * np.pi * 0.2 * t)) * 0.12
              sig *= np.clip(np.minimum(t / 2, (total - t) / 2), 0, 1)
              with wave.open(saida, "w") as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
                  w.writeframes((sig / np.abs(sig).max() * 0.5 * 32767).astype("int16").tobytes())


          def montar(a):
              os.makedirs("tmp", exist_ok=True); lista = []
              for i, c in enumerate(a["cenas"], 1):
                  wav, png, mp4 = f"tmp/n{i}.wav", f"tmp/c{i}.png", f"tmp/c{i}.mp4"
                  narrar(c["fala"], wav)
                  dur = round(duracao(wav) + 0.9, 2)
                  cena(c).save(png)
                  run(["ffmpeg", "-y", "-loglevel", "error", "-framerate", "30", "-i", png, "-i", wav,
                       "-vf", f"format=yuv420p,loop=-1:1,trim=duration={dur},fade=t=in:st=0:d=0.3,fade=t=out:st={dur - 0.3}:d=0.3",
                       "-af", f"adelay=300|300,apad,atrim=duration={dur}",
                       "-c:v", "libx264", "-crf", "18", "-preset", "veryfast", "-pix_fmt", "yuv420p", "-r", "30",
                       "-c:a", "aac", "-ar", "44100", "-ac", "1", "-t", str(dur), mp4])
                  lista.append(f"file 'c{i}.mp4'")
              open("tmp/lista.txt", "w").write("\n".join(lista))
              run(["ffmpeg", "-y", "-loglevel", "error", "-f", "concat", "-safe", "0", "-i", "tmp/lista.txt", "-c", "copy", "tmp/base.mp4"])
              total = duracao("tmp/base.mp4"); musica(total, "tmp/musica.wav")
              run(["ffmpeg", "-y", "-loglevel", "error", "-i", "tmp/base.mp4", "-i", "tmp/musica.wav",
                   "-filter_complex", "[1:a]volume=0.22[m];[0:a][m]amix=inputs=2:duration=first:normalize=0[a]",
                   "-map", "0:v", "-map", "[a]", "-c:v", "copy", "-c:a", "aac", "-b:a", "128k", "video.mp4"])
              open("titulo.txt", "w", encoding="utf-8").write(a["titulo"])
              open("descricao.txt", "w", encoding="utf-8").write(
                  a["descricao"] + "\n\nSegue o canal para mais curiosidades de ciência!\n\n#Shorts #Ciência #Curiosidades")
              open("slug.txt", "w").write(a["slug"])
              print("pronto:", a["slug"], round(total, 1), "segundos")


          def ja_publicados():
              if os.environ.get("STUB_TTS"):
                  return set(filter(None, os.environ.get("JA_FEITOS", "").split(",")))
              out = subprocess.check_output(["gh", "release", "list", "--repo", os.environ["GITHUB_REPOSITORY"],
                                             "--limit", "300", "--json", "tagName", "-q", ".[].tagName"]).decode().split()
              return {t.replace("short-", "", 1) for t in out if t.startswith("short-")}


          if __name__ == "__main__":
              feitos = ja_publicados()
              fila = [a for a in ASSUNTOS if a["slug"] not in feitos]
              if os.environ.get("SO_ESTE"):
                  fila = [a for a in ASSUNTOS if a["slug"] == os.environ["SO_ESTE"]]
              if not fila:
                  print("A fila de assuntos acabou. Peça novos assuntos para o Claude.")
              else:
                  montar(fila[0])
          PY
      - name: Publicar o vídeo num link público
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f video.mp4 ]; then echo "Nada para publicar (fila vazia)."; exit 0; fi
          SLUG=$(cat slug.txt)
          gh release create "short-$SLUG" video.mp4 --repo "${{ github.repository }}" --title "$(cat titulo.txt)" --notes-file descricao.txt
          echo "Link: ${{ github.server_url }}/${{ github.repository }}/releases/download/short-$SLUG/video.mp4"
